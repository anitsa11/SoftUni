<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Card</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="portfolio-card">
        <header class="header-card">
            <div class="name">JOHN.DOE</div>
            <nav class="first-menu">
                <a href="#">Home</a>
                <a href="#">Projects</a>
                <a href="#">Skills</a>
                <a href="#">Blog</a>
                <a href="#">Contact</a>
            </nav>
            <nav class="second-menu">
                <img src="images/GitHub.png" alt="GitHub">
                <img src="images/Dribbble.png" alt="Dribbble">
                <img src="images/Instagram.png" alt="Instagram">
            </nav>
        </header>

        <main class="card-info">
            <div class="left-info">
                <h1>John Doe</h1>
                <p class="person-info">
                 Available for freelance projects and collaborations. I bring ideas to life through thoughtful design and clean code.   
                </p>
                <a href="#" class="btn">View My Work ></a>
            </div>
            <div class="right-info">
                <div class="img-container">
                    <img src="images/profile_350x350.png" alt="John Doe">
                </div>
            </div>
        </main>

        <footer class="footer-card">
            <p class="trusted-text">Trusted by:</p>
            <div class="brands-container">
                <div class="prog-brand">
                    <img src="images/notion logo.png" alt="notion logo">
                </div>
                <div class="prog-brand">
                    <img src="images/figma logo.png" alt="figma logo">
                </div>
                <div class="prog-brand">
                    <img src="images/webflow logo.png" alt="webflow logo">
                </div>
                <div class="prog-brand">
                    <img src="images/framer logo.png" alt="framer logo">
                </div>
                                <div class="prog-brand">
                    <img src="images/adobe logo.png" alt="adobe logo">
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
